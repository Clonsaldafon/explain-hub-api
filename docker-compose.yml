services:
  auth-db:
    image: postgres:15
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth123
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  qna-db:
    image: postgres:15
    container_name: qna-db
    environment:
      POSTGRES_DB: qnadb
      POSTGRES_USER: qna
      POSTGRES_PASSWORD: qna123
    ports:
      - "5433:5432"
    volumes:
      - qna-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qna -d qnadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./src/AuthService
    container_name: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__AuthDb=Host=${AUTH_DB_HOST:-auth-db};Port=${AUTH_DB_PORT:-5432};Database=${AUTH_DB_NAME:-authdb};Username=${AUTH_DB_USER:-auth};Password=${AUTH_DB_PASSWORD:-auth123}
      - RabbitMQ__HostName=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - RabbitMQ__QueueNameEmailConfirmation=email_confirmation
      - RabbitMQ__QueueNameUserDeleted=user.deleted
      - RabbitMQ__QueueNameUserContentDeleted=user_content_deleted
      - Consul__Host=${CONSUL_HOST:-http://consul:8500}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-auth-service}
      - Jwt__Audience=${JWT_AUDIENCE:-api-gateway}
      - Jwt__AccessTokenExpirationMinutes=${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      - Jwt__RefreshTokenExpirationDays=${JWT_REFRESH_EXPIRATION_DAYS:-7}
      - Admin__Email=${ADMIN_EMAIL:-admin@example.com}
      - Admin__Password=${ADMIN_PASSWORD:-admin123}
      - Analytics__ServiceUrl=http://analytics-service:8080/
    ports:
      - "8080:80"
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  qna-service:
    build:
      context: .
      dockerfile: src/QnaService/Dockerfile
    container_name: qna-service
    depends_on:
      qna-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      consul:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__QnaDb=Host=${QNA_DB_HOST:-qna-db};Port=${QNA_DB_PORT:-5432};Database=${QNA_DB_NAME:-qnadb};Username=${QNA_DB_USER:-qna};Password=${QNA_DB_PASSWORD:-qna123}
      - App__PublicBaseUrl=${QNA_PUBLIC_BASE_URL:-http://localhost:8082}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-auth-service}
      - Jwt__Audience=${JWT_AUDIENCE:-api-gateway}
      - RabbitMQ__HostName=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - RabbitMQ__ExchangeName=${RABBITMQ_EMAIL_EXCHANGE:-email-exchange}
      - RabbitMQ__LikeRoutingKey=${RABBITMQ_LIKE_ROUTING_KEY:-like-notification}
      - Minio__Endpoint=${MINIO_ENDPOINT:-minio:9000}
      - Minio__PublicEndpoint=${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      - Minio__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - Minio__BucketName=${MINIO_BUCKET_NAME:-qna-media}
      - Minio__UseSsl=${MINIO_USE_SSL:-false}
      - Consul__Host=${CONSUL_HOST:-http://consul:8500}
      - Consul__ServiceAddress=qna-service
      - Consul__ServicePort=80
      - Analytics__ServiceUrl=http://analytics-service:8080/
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
  
  analytics-service:
    image: analytics-service
    build:
      context: .
      dockerfile: src/AnalyticsService/Dockerfile
    ports:
      - "8085:8080"
    depends_on:
      clickhouse-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
  
  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9002:9002"
    environment:
      - CLICKHOUSE_DB=logs_db
      - CLICKHOUSE_USER=analytics
      - CLICKHOUSE_PASSWORD=analytics123
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - clickhouse-server

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - qna-service
      - api-gateway

  worker:
    build:
      context: .
      dockerfile: src/Worker/Dockerfile
    container_name: worker-service
    env_file:
      - .env
    depends_on:
      auth-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - SmtpSettings__Host=smtp.yandex.ru
      - SmtpSettings__Port=465
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__SenderName=ExplainHub

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api-gateway
    depends_on:
      auth-service:
        condition: service_started
      qna-service:
        condition: service_started
      consul:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Consul__Host=http://consul:8500
    ports:
      - "8099:80"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  auth-db-data:
  qna-db-data:
  clickhouse-data:
  minio-data: