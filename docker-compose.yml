services:
  auth-db:
    image: postgres:15
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth123
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./src/AuthService
    container_name: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment: 
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__AuthDb=Host=${AUTH_DB_HOST:-auth-db};Port=${AUTH_DB_PORT:-5432};Database=${AUTH_DB_NAME:-authdb};Username=${AUTH_DB_USER:-auth};Password=${AUTH_DB_PASSWORD:-auth123}
      - RabbitMQ__HostName=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - Consul__Host=${CONSUL_HOST:-http://consul:8500}     
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-auth-service}
      - Jwt__Audience=${JWT_AUDIENCE:-api-gateway}
      - Jwt__AccessTokenExpirationMinutes=${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      - Jwt__RefreshTokenExpirationDays=${JWT_REFRESH_EXPIRATION_DAYS:-7}
      - Admin__Email=${ADMIN_EMAIL:-admin@example.com}
      - Admin__Password=${ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:80"
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      
  analytics-service:
    image: analytics-service
    build:
      context: .
      dockerfile: src/AnalyticsService/Dockerfile
    ports:
      - "8085:8080"
    depends_on:
      clickhouse-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    
  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
    environment:
      - CLICKHOUSE_DB=logs_db
      - CLICKHOUSE_USER=analytics
      - CLICKHOUSE_PASSWORD=analytics123      
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  
  worker:
    build: 
      context: .
      dockerfile: src/Worker/Dockerfile
    container_name: worker-service
    env_file:
      - .env
    depends_on:
      auth-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - SmtpSettings__Host=smtp.yandex.ru
      - SmtpSettings__Port=465
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__SenderName=ExplainHub
volumes:
  auth-db-data:
  clickhouse-data: